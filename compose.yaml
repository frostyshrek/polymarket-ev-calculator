services:
  postgres:
    image: postgres:17-alpine
    container_name: ufc-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ufc_study
      POSTGRES_USER: ufc_study
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "5432:5432"
    volumes:
      - ufc-study-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ufc_study -d ufc_study"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ufc-study-postgres-data: