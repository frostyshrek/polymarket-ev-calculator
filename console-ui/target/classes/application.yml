spring:
  application:
    name: ufc-study-console

  main:
    web-application-type: none
    banner-mode: off

  datasource:
    url: ${UFC_DB_URL:jdbc:postgresql://localhost:5432/ufc_study}
    username: ${UFC_DB_USER:ufc_study}
    password: ${UFC_DB_PASSWORD:local_development_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

logging:
  level:
    root: WARN

ufc-study:
  sportsbook:
    enabled: ${SPORTSBOOK_INGESTION_ENABLED:false}
    api-key: ${SPORTSBOOK_API_KEY:}
    base-url: ${SPORTSBOOK_API_BASE_URL:}
    region: ${SPORTSBOOK_REGION:us}
    market: ${SPORTSBOOK_MARKET:h2h}

  polymarket:
    enabled: ${POLYMARKET_INGESTION_ENABLED:false}
    gamma-base-url: ${POLYMARKET_GAMMA_BASE_URL:https://gamma-api.polymarket.com}
    clob-base-url: ${POLYMARKET_CLOB_BASE_URL:https://clob.polymarket.com}
    event-slug: ${POLYMARKET_EVENT_SLUG:}